  <style>
    #applyDone{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:130px 20px 90px;background:radial-gradient(700px 400px at 50% 0%,rgba(19,181,163,.12),transparent 60%),#fff;text-align:center;container-type:inline-size;font-family:Pretendard,"Noto Sans KR",sans-serif;color:#0b1220}
    #applyDone .ad-in{max-width:620px}
    #applyDone .ad-ic{width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#20d3be,#0b7a70);box-shadow:0 20px 40px -16px rgba(11,122,112,.7);animation:adPop .7s cubic-bezier(.22,.78,.21,1.4) both}
    #applyDone .ad-ic svg{width:46px;height:46px;stroke:#fff;stroke-dasharray:40;stroke-dashoffset:40;animation:adDraw .6s .4s ease forwards}
    @keyframes adPop{from{transform:scale(.4);opacity:0}}
    @keyframes adDraw{to{stroke-dashoffset:0}}
    #applyDone h1{margin-top:28px;font-size:clamp(28px,5cqi,40px);font-weight:900;letter-spacing:-1px;line-height:1.3}
    #applyDone h1 b{color:#0fb3a2}
    #applyDone p{margin-top:14px;color:#475467;font-size:16.5px;line-height:1.75}
    #applyDone .ad-box{margin-top:28px;padding:20px 22px;border-radius:18px;background:#f6f9fb;text-align:left;font-size:15px;line-height:1.8;color:#344054}
    #applyDone .ad-box b{color:#0b1220}
    #applyDone .ad-btns{margin-top:30px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
    #applyDone .ad-btns a{display:inline-flex;align-items:center;height:54px;padding:0 26px;border-radius:999px;font-weight:800}
    #applyDone .ad-btns .p{background:#0b1220;color:#fff}
    #applyDone .ad-btns .g{border:1.5px solid #e3e8ef}
  </style>
  <div class="ad-in">
    <div class="ad-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1><span data-nm></span>상담 신청이<br><b>정상적으로 접수되었습니다</b></h1>

    <div class="ad-box"><b>상담 전 준비해 두시면 좋아요</b><br>· 최근 3개년 매출 규모와 현재 대출 현황<br>· 필요한 자금의 용도와 대략적인 금액<br>· 사업자등록증, 재무제표 (상담 후 요청 시)</div>
    <div class="ad-btns"><a class="p" href="./index.html">홈으로</a><a class="g" href="./fund-info.html">정책자금 정보 보기</a></div>
  </div>
