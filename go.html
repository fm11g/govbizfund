<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오늘의 정책자금 | 이동 중</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="오늘의 정책자금" />
  <meta property="og:title" content="오늘의 정책자금 | 연매출 4억 이상 사업자 정책자금 무료 진단" />
  <meta property="og:description" content="운전자금 · 시설자금 · 수출자금 · 대환대출 — 매출 규모에 맞는 자금과 예상 한도를 무료로 진단해 드립니다." />
  <meta property="og:image" content="https://todaypolicyfund.co.kr/img/og-image.jpg" />
  <link rel="icon" type="image/svg+xml" href="./img/favicon.svg" />
  <style>
    #goPage { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #0b7a70, #12a08f); color: #fff;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    #goPage .go-box { text-align: center; padding: 32px 24px; }
    #goPage .go-logo { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 18px; }
    #goPage .go-spin { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; animation: goSpin .8s linear infinite; }
    #goPage p { margin: 0; font-size: 15px; opacity: .9; }
    #goPage a { color: #fff; font-weight: 700; }
    @keyframes goSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #goPage .go-spin { animation: none; } }
  </style>
</head>
<body id="goPage">
  <div class="go-box">
    <p class="go-logo">오늘의 정책자금</p>
    <div class="go-spin" aria-hidden="true"></div>
    <p>정책자금 정보로 이동하고 있습니다… <noscript><a href="./index.html#fundForm">바로 가기</a></noscript></p>
  </div>
<script>
/* 숏폼 공장 추적 링크: go.html?c=코드&ch=yt|ytc|ig|igc|igp  (c=today → 가장 최근 숏폼)
   data/shorts.json 에서 코드의 목적지(마감 전 오늘의 랜딩 → 정보글 → 신청폼)를 찾아 코드 · 채널을 붙여 이동합니다.
   실제 유입 기록은 이동한 페이지의 js/site.js (TF_TRACK) 가 남깁니다. */
(function () {
  var sp = new URLSearchParams(location.search);
  var code = String(sp.get('c') || '').toLowerCase();
  var done = false;
  function go(dest, realCode) {
    if (done) return; done = true;
    dest = /^\.\/[A-Za-z0-9._\-\/]*(#[A-Za-z0-9_\-]*)?$/.test(dest || '') ? dest : './index.html#fundForm';
    var hash = '', i = dest.indexOf('#');
    if (i >= 0) { hash = dest.slice(i); dest = dest.slice(0, i); }
    var q = new URLSearchParams();
    if (/^[a-z0-9]{4,24}$/.test(realCode || '')) q.set('c', realCode);
    ['ch', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) { var v = sp.get(k); if (v) q.set(k, v.slice(0, 120)); });
    if (!q.get('utm_campaign') && q.get('c')) q.set('utm_campaign', q.get('c'));
    var qs = q.toString();
    location.replace(dest + (qs ? '?' + qs : '') + hash);
  }
  var timer = setTimeout(function () { go('./index.html#fundForm', code === 'today' ? '' : code); }, 3500);
  fetch('./data/shorts.json?v=' + Math.floor(Date.now() / 6e5), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (idx) {
      clearTimeout(timer);
      var items = (idx && idx.items) || {};
      var real = code === 'today' || !code ? idx.latest || '' : code;
      var it = items[real];
      // 오늘의 랜딩이 마감 전이면 랜딩으로, 마감됐으면 정보글(없으면 신청폼)로
      var lpLive = it && it.lp && (!it.dl || Date.parse(it.dl) > Date.now());
      go(lpLive ? './today.html' : (it && it.dest ? it.dest : './index.html#fundForm'), real);
    })
    .catch(function () { clearTimeout(timer); go('./index.html#fundForm', code === 'today' ? '' : code); });
})();
</script>
</body>
</html>
